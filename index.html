<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Alfred</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0a0a0a; }
    body { font-family: "Inter", -apple-system, sans-serif; color: #f0f0f0; }
    :root { --bd:rgba(255,255,255,0.07);--td:rgba(255,255,255,0.35);--tf:rgba(255,255,255,0.18);--su:rgba(255,255,255,0.04); }

    /* ── Mini overlay ── */
    #mini-overlay { display:none;position:fixed;inset:0;z-index:200;overflow:hidden;background:#0a0a0a; }
    #mini-overlay.show { display:block; }
    #mini-photo { position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 10%;pointer-events:none; }
    #mini-gradient { position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.05) 55%,transparent 100%);pointer-events:none; }
    #mini-drag { position:absolute;top:0;left:0;right:0;height:28px;-webkit-app-region:drag;z-index:2; }
    #mini-click { position:absolute;top:28px;left:0;right:0;bottom:0;cursor:pointer;z-index:2;-webkit-app-region:no-drag;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px; }
    #mini-name { font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:.14em;line-height:1.1; }
    #mini-status { font-size:7px;color:rgba(255,255,255,.45);letter-spacing:.16em;margin-top:1px; }

    /* ── Setup ── */
    #setup { position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0a0a0a;padding:24px; }
    .sc { width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px; }
    .sc-logo { font-family:"Bebas Neue",sans-serif;font-size:52px;letter-spacing:.12em;text-align:center;line-height:1; }
    .sc-sub { text-align:center;font-size:10px;color:var(--td);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px; }
    .sc-lbl { font-size:11px;color:var(--td);letter-spacing:.05em;margin-bottom:5px; }
    .sc-inp { width:100%;background:var(--su);border:1px solid var(--bd);color:#f0f0f0;padding:12px 16px;border-radius:12px;font-family:"Inter",sans-serif;font-size:13px;outline:none;transition:border-color .2s; }
    .sc-inp:focus { border-color:rgba(255,255,255,.25); }
    .sc-inp::placeholder { color:rgba(255,255,255,.2); }
    .sc-hr { border:none;border-top:1px solid var(--bd); }
    .sc-btn { background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);padding:13px;border-radius:12px;font-family:"Inter",sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.04em; }
    .sc-btn:hover { background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3); }

    /* ── App shell ── */
    #app { display:none;height:100vh; }
    .app-wrap { display:flex;height:100%; }

    /* ── Sidebar ── */
    #sidebar { width:58px;flex-shrink:0;background:#090909;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:44px 0 18px;-webkit-app-region:drag; }
    .sb-btn { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.3);font-size:15px;user-select:none;-webkit-user-select:none;-webkit-app-region:no-drag; }
    .sb-btn:hover { border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.8); }
    .sb-btn.on { border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.8);background:rgba(255,255,255,.07); }
    .sb-btn.sm { width:28px;height:28px;font-size:12px; }
    #sb-title { flex:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-lr;transform:rotate(180deg);font-family:"Bebas Neue",sans-serif;font-size:32px;letter-spacing:.14em;color:#f0f0f0;user-select:none;line-height:1;-webkit-app-region:drag; }
    #sb-status { writing-mode:vertical-lr;transform:rotate(180deg);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--td);margin-bottom:12px;user-select:none;-webkit-app-region:drag; }
    #sb-clock { writing-mode:vertical-lr;transform:rotate(180deg);font-size:10px;color:var(--tf);letter-spacing:.06em;margin-bottom:16px;font-weight:300;-webkit-app-region:drag; }
    #sb-avatar { width:32px;height:32px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tf);font-size:11px;flex-shrink:0;transition:border-color .2s;-webkit-app-region:no-drag; }
    #sb-avatar:hover { border-color:rgba(255,255,255,.45); }
    #sb-avatar img { width:100%;height:100%;object-fit:cover;object-position:center 15%; }

    /* ── Main content (chat + task panel) ── */
    #main-wrap { flex:1;display:flex;overflow:hidden; }

    /* ── Chat column ── */
    #chat-col { flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;padding-top:28px; }
    #sett-panel { display:none;padding:14px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd);flex-shrink:0; }
    .sp-lbl { font-size:11px;color:var(--td);margin-bottom:6px;letter-spacing:.04em; }
    .sp-inp { width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.8);padding:8px 12px;border-radius:8px;font-family:"Inter",sans-serif;font-size:12px;outline:none;transition:border-color .2s;margin-bottom:10px; }
    .sp-inp:focus { border-color:rgba(255,255,255,.3); }
    .sp-inp::placeholder { color:rgba(255,255,255,.2); }
    .sp-row { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
    .sp-btn { background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);padding:6px 14px;border-radius:8px;font-family:"Inter",sans-serif;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap; }
    .sp-btn:hover { background:rgba(255,255,255,.12); }
    .sp-btn:disabled { opacity:.35;cursor:default; }
    #sett-err { font-size:11px;color:rgba(255,150,130,.8);margin-top:8px;display:none; }
    #mem-badge { font-size:9px;color:rgba(255,255,255,.2);letter-spacing:.06em;padding:4px 18px;border-bottom:1px solid var(--bd);flex-shrink:0; }
    #qa { padding:12px 18px 10px;display:flex;gap:7px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--bd);scrollbar-width:none; }
    #qa::-webkit-scrollbar { display:none; }
    .qa-btn { background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);padding:5px 14px;border-radius:20px;font-family:"Inter",sans-serif;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap; }
    .qa-btn:hover { border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.85); }
    #msgs { flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px; }
    #msgs::-webkit-scrollbar { width:2px; }
    #msgs::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1);border-radius:1px; }
    .msg-row { display:flex;gap:10px;align-items:flex-start;animation:alf-in .28s ease; }
    .msg-row.u { flex-direction:row-reverse; }
    .msg-av { width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500; }
    .msg-av.a { background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7); }
    .msg-av.u { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.35); }
    .msg-body { max-width:78%;display:flex;flex-direction:column;gap:6px; }
    .msg-row.u .msg-body { align-items:flex-end; }
    .bbl { line-height:1.7;font-size:14px;font-weight:400;white-space:pre-wrap;padding:11px 15px;background:var(--su);border:1px solid var(--bd); }
    .bbl.a { border-radius:4px 16px 16px 16px;color:rgba(255,255,255,.88); }
    .bbl.u { border-radius:16px 4px 16px 16px;color:rgba(255,255,255,.5); }
    .msg-img { max-width:200px;max-height:130px;border-radius:10px;border:1px solid var(--bd);object-fit:cover; }
    .typ { background:var(--su);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:14px 18px;display:flex;gap:5px;align-items:center; }
    .td { width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.6);animation:alf-dot 1.2s ease-in-out infinite; }
    .td:nth-child(2){animation-delay:.18s} .td:nth-child(3){animation-delay:.36s}
    #err-bar { display:none;padding:7px 18px;background:rgba(200,80,60,.08);border-top:1px solid rgba(200,80,60,.15);font-size:11px;color:rgba(255,150,130,.8);flex-shrink:0;align-items:center;gap:8px; }
    #err-bar.show { display:flex; }
    #att-bar { display:none;padding:8px 18px;align-items:center;gap:10px;border-top:1px solid var(--bd);flex-shrink:0; }
    #att-bar.show { display:flex; }
    #att-thumb { width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--bd); }
    #att-name { font-size:12px;color:var(--td);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    #inp-area { padding:11px 18px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end;flex-shrink:0; }
    .inp-btn { width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .2s;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);background:transparent;user-select:none;-webkit-user-select:none; }
    .inp-btn:hover { border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.8); }
    .inp-btn.on { border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.9);background:rgba(255,255,255,.1); }
    #inp-send { background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.65); }
    #inp-send:hover { background:rgba(255,255,255,.12); }
    #inp-wrap { flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:20px;padding:0 16px;display:flex;align-items:center;min-height:44px;transition:border-color .2s; }
    #inp-wrap:focus-within { border-color:rgba(255,255,255,.2); }
    #inp-text { flex:1;background:transparent;border:none;outline:none;resize:none;color:rgba(255,255,255,.85);font-family:"Inter",sans-serif;font-size:14px;font-weight:300;line-height:1.5;padding:12px 0;max-height:80px; }
    #inp-text::placeholder { color:rgba(255,255,255,.2); }

    /* ── Task Panel ── */
    #task-panel {
      width: 0; flex-shrink:0;
      background:#090909;
      border-left:1px solid var(--bd);
      display:flex;flex-direction:column;
      overflow:hidden;
      transition: width .25s ease;
    }
    #task-panel.open { width:260px; }
    #tp-header { padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--bd); }
    #tp-title { font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:.1em;color:rgba(255,255,255,.8); }
    #tp-close { cursor:pointer;font-size:14px;color:var(--tf);padding:2px 4px;border-radius:4px; }
    #tp-close:hover { color:rgba(255,255,255,.7); }
    #tp-body { flex:1;overflow-y:auto;padding:8px 0; }
    #tp-body::-webkit-scrollbar { width:2px; }
    #tp-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); }
    .tp-bucket { margin-bottom:2px; }
    .tp-bucket-hd { display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;user-select:none; }
    .tp-bucket-hd:hover { background:rgba(255,255,255,.03); }
    .tp-bucket-arrow { font-size:9px;color:var(--tf);transition:transform .2s;flex-shrink:0; }
    .tp-bucket-arrow.open { transform:rotate(90deg); }
    .tp-bucket-name { font-size:11px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:.04em;flex:1; }
    .tp-bucket-count { font-size:10px;color:var(--tf); }
    .tp-tasks { display:none;padding:2px 0 6px; }
    .tp-tasks.open { display:block; }
    .tp-task { display:flex;align-items:flex-start;gap:8px;padding:5px 14px 5px 28px;group:task; }
    .tp-task:hover { background:rgba(255,255,255,.03); }
    .tp-cb { width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.2);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:transparent; }
    .tp-cb.done { background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3); }
    .tp-cb.done::after { content:"✓";font-size:9px;color:rgba(255,255,255,.8); }
    .tp-task-text { font-size:12px;color:rgba(255,255,255,.65);flex:1;line-height:1.5;cursor:pointer; }
    .tp-task-text.done { text-decoration:line-through;color:rgba(255,255,255,.25); }
    .tp-task-del { font-size:11px;color:rgba(255,255,255,.15);cursor:pointer;padding:0 2px;opacity:0;transition:opacity .15s; }
    .tp-task:hover .tp-task-del { opacity:1; }
    .tp-task-del:hover { color:rgba(255,100,100,.6); }
    .tp-add-task { display:flex;align-items:center;gap:6px;padding:4px 14px 4px 28px; }
    .tp-add-inp { flex:1;background:transparent;border:none;outline:none;font-family:"Inter",sans-serif;font-size:12px;color:rgba(255,255,255,.5);padding:3px 0; }
    .tp-add-inp::placeholder { color:rgba(255,255,255,.18); }
    #tp-footer { padding:10px 14px;border-top:1px solid var(--bd);flex-shrink:0; }
    #tp-add-bucket { display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--tf);font-size:11px;letter-spacing:.04em; }
    #tp-add-bucket:hover { color:rgba(255,255,255,.6); }
    #tp-bucket-inp { display:none;flex:1;background:transparent;border:none;border-bottom:1px solid var(--bd);outline:none;font-family:"Inter",sans-serif;font-size:11px;color:rgba(255,255,255,.7);padding:2px 0; }
    #tp-bucket-inp::placeholder { color:rgba(255,255,255,.2); }

    @keyframes alf-in  { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    @keyframes alf-dot { 0%,100%{opacity:.2;transform:translateY(0)} 50%{opacity:.9;transform:translateY(-3px)} }
    @keyframes alf-blk { 0%,100%{opacity:.5} 50%{opacity:1} }
    .blink { animation:alf-blk .7s ease-in-out infinite; }
  </style>
</head>
<body>

<!-- Mini overlay -->
<div id="mini-overlay">
  <img id="mini-photo" src="" alt="Alfred">
  <div id="mini-gradient"></div>
  <div id="mini-drag"></div>
  <div id="mini-click" onclick="toggleMini()">
    <div id="mini-name">ALFRED</div>
    <div id="mini-status">ACTIVE</div>
  </div>
</div>

<!-- Setup -->
<div id="setup">
  <div class="sc">
    <div class="sc-logo">ALFRED</div>
    <div class="sc-sub">Personal Assistant</div>
    <div>
      <div class="sc-lbl">Anthropic API Key <span style="color:rgba(255,255,255,.4)">(requerida)</span></div>
      <input class="sc-inp" id="sc-ak" type="password" placeholder="sk-ant-..." autocomplete="off">
    </div>
    <hr class="sc-hr">
    <div>
      <div class="sc-lbl">OpenAI API Key <span style="color:rgba(255,255,255,.4)">(microfono Whisper)</span></div>
      <input class="sc-inp" id="sc-ok" type="password" placeholder="sk-..." autocomplete="off">
    </div>
    <hr class="sc-hr">
    <div>
      <div class="sc-lbl">ElevenLabs API Key <span style="color:rgba(255,255,255,.4)">(voz Gael)</span></div>
      <input class="sc-inp" id="sc-ek" type="password" placeholder="sk_..." autocomplete="off">
    </div>
    <button class="sc-btn" onclick="startApp()">Iniciar Alfred</button>
    <div id="sc-err" style="font-size:11px;color:rgba(255,150,130,.8);text-align:center;display:none"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="app-wrap">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="sb-btn on" id="sb-voice" onclick="toggleVoice()">&#128266;</div>
      <div class="sb-btn sm" id="sb-sett" onclick="toggleSettings()" style="margin-top:8px">&#9881;</div>
      <div class="sb-btn sm" id="sb-tasks" onclick="toggleTaskPanel()" style="margin-top:8px;margin-bottom:16px" title="Mis tareas">&#9776;</div>
      <div id="sb-title">ALFRED</div>
      <div id="sb-status">ACTIVE</div>
      <div id="sb-clock">--:--</div>
      <div id="sb-avatar" title="Modo mini" onclick="toggleMini()">A</div>
    </div>

    <!-- Main wrap: chat + task panel -->
    <div id="main-wrap">
      <!-- Chat column -->
      <div id="chat-col">
        <div id="sett-panel">
          <div class="sp-lbl">Anthropic API Key</div>
          <input class="sp-inp" id="sp-ak" type="password" placeholder="sk-ant-..." oninput="saveKeys()">
          <div class="sp-lbl">OpenAI API Key (microfono Whisper)</div>
          <input class="sp-inp" id="sp-ok" type="password" placeholder="sk-..." oninput="saveKeys()">
          <div class="sp-lbl">ElevenLabs API Key (voz Gael)</div>
          <input class="sp-inp" id="sp-ek" type="password" placeholder="sk_..." oninput="saveKeys()">
          <div class="sp-row">
            <button class="sp-btn" id="sp-test" onclick="testVoice()">Probar voz</button>
            <button class="sp-btn" onclick="clearHistory()">Borrar historial</button>
            <button class="sp-btn" onclick="toggleSettings()">Guardar</button>
          </div>
          <div id="sett-err"></div>
        </div>
        <div id="mem-badge"></div>
        <div id="qa"></div>
        <div id="msgs"></div>
        <div id="err-bar">
          <span id="err-txt"></span>
          <span style="cursor:pointer;opacity:.6;font-size:16px;margin-left:auto" onclick="hideError()">x</span>
        </div>
        <div id="att-bar">
          <img id="att-thumb" src="" alt="">
          <div id="att-name"></div>
          <span style="font-size:18px;color:var(--td);cursor:pointer;padding:2px 8px" onclick="clearAttachment()">x</span>
        </div>
        <div id="inp-area">
          <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="handleFile(event)">
          <div class="inp-btn" onclick="document.getElementById('file-inp').click()">&#128206;</div>
          <div id="inp-wrap">
            <textarea id="inp-text" placeholder="Escriba un mensaje..." rows="1"
              oninput="autoResize(this)"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
          </div>
          <div class="inp-btn" id="inp-mic" onclick="toggleMic()">&#127897;</div>
          <div class="inp-btn" id="inp-send" onclick="unlockAudio();sendMessage()">&#8593;</div>
        </div>
      </div>

      <!-- Task panel -->
      <div id="task-panel">
        <div id="tp-header">
          <div id="tp-title">MIS TAREAS</div>
          <div id="tp-close" onclick="toggleTaskPanel()">&#x2715;</div>
        </div>
        <div id="tp-body"></div>
        <div id="tp-footer">
          <div id="tp-add-bucket" onclick="showBucketInput()">
            <span style="font-size:14px">+</span> Nueva categoria
          </div>
          <input id="tp-bucket-inp" placeholder="Nombre de la categoria..." 
            onkeydown="if(event.key==='Enter')addBucket(this.value.trim());if(event.key==='Escape')hideBucketInput()">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var PROXY       = "https://alfred-proxy.pablo-f-aneas.workers.dev";
var ANT_URL     = PROXY + "/anthropic/v1/messages";

// ── Task data ──
function loadTasks(){ try{return JSON.parse(LS.get("alf_tasks")||"[]");}catch(e){return [];} }
function saveTasks(buckets){ LS.set("alf_tasks",JSON.stringify(buckets)); }
function uid(){ return Math.random().toString(36).substr(2,9); }

function getBuckets(){ return loadTasks(); }

function taskOp(op){
  var buckets = getBuckets();
  if(op.action === "add_bucket"){
    if(!buckets.find(function(b){return b.name===op.bucket;})){
      buckets.push({id:uid(),name:op.bucket,open:true,tasks:[]});
      saveTasks(buckets); renderTasks();
    }
  } else if(op.action === "add"){
    var bucket = buckets.find(function(b){return b.name===op.bucket;});
    if(!bucket){
      bucket={id:uid(),name:op.bucket,open:true,tasks:[]};
      buckets.push(bucket);
    }
    bucket.tasks.push({id:uid(),text:op.task,done:false});
    saveTasks(buckets); renderTasks();
  } else if(op.action === "complete"){
    buckets.forEach(function(b){
      b.tasks.forEach(function(t){
        if(t.text.toLowerCase()===op.task.toLowerCase()) t.done=true;
      });
    });
    saveTasks(buckets); renderTasks();
  } else if(op.action === "delete"){
    buckets.forEach(function(b){
      b.tasks=b.tasks.filter(function(t){return t.text.toLowerCase()!==op.task.toLowerCase();});
    });
    saveTasks(buckets); renderTasks();
  }
}

function addBucket(name){
  if(!name) return;
  taskOp({action:"add_bucket",bucket:name});
  hideBucketInput();
}

function toggleBucketOpen(id){
  var buckets=getBuckets();
  var b=buckets.find(function(b){return b.id===id;});
  if(b) b.open=!b.open;
  saveTasks(buckets); renderTasks();
}

function toggleTaskDone(bucketId,taskId){
  var buckets=getBuckets();
  var b=buckets.find(function(b){return b.id===bucketId;});
  if(b){var t=b.tasks.find(function(t){return t.id===taskId;});if(t)t.done=!t.done;}
  saveTasks(buckets); renderTasks();
}

function deleteTask(bucketId,taskId){
  var buckets=getBuckets();
  var b=buckets.find(function(b){return b.id===bucketId;});
  if(b) b.tasks=b.tasks.filter(function(t){return t.id!==taskId;});
  saveTasks(buckets); renderTasks();
}

function addTaskToB(bucketId,text){
  if(!text) return;
  var buckets=getBuckets();
  var b=buckets.find(function(b){return b.id===bucketId;});
  if(b) b.tasks.push({id:uid(),text:text,done:false});
  saveTasks(buckets); renderTasks();
}

function renderTasks(){
  var buckets=getBuckets();
  var body=document.getElementById("tp-body");
  body.innerHTML="";
  buckets.forEach(function(bucket){
    var pending=bucket.tasks.filter(function(t){return !t.done;}).length;
    var div=document.createElement("div"); div.className="tp-bucket";
    var hd=document.createElement("div"); hd.className="tp-bucket-hd";
    hd.onclick=function(){toggleBucketOpen(bucket.id);};
    var arrow=document.createElement("span"); arrow.className="tp-bucket-arrow"+(bucket.open?" open":""); arrow.textContent="\u25B6";
    var name=document.createElement("span"); name.className="tp-bucket-name"; name.textContent=bucket.name;
    var count=document.createElement("span"); count.className="tp-bucket-count"; count.textContent=pending>0?pending:"";
    hd.appendChild(arrow); hd.appendChild(name); hd.appendChild(count);
    div.appendChild(hd);
    var tlist=document.createElement("div"); tlist.className="tp-tasks"+(bucket.open?" open":"");
    bucket.tasks.forEach(function(task){
      var row=document.createElement("div"); row.className="tp-task";
      var cb=document.createElement("div"); cb.className="tp-cb"+(task.done?" done":"");
      cb.onclick=function(){toggleTaskDone(bucket.id,task.id);};
      var txt=document.createElement("span"); txt.className="tp-task-text"+(task.done?" done":""); txt.textContent=task.text;
      var del=document.createElement("span"); del.className="tp-task-del"; del.textContent="\u2715";
      del.onclick=function(e){e.stopPropagation();deleteTask(bucket.id,task.id);};
      row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
      tlist.appendChild(row);
    });
    // Add task input
    var addRow=document.createElement("div"); addRow.className="tp-add-task";
    var addInp=document.createElement("input"); addInp.className="tp-add-inp"; addInp.placeholder="+ Anadir tarea...";
    addInp.onkeydown=function(e){
      if(e.key==="Enter"&&this.value.trim()){addTaskToB(bucket.id,this.value.trim());this.value="";}
    };
    addRow.appendChild(addInp);
    tlist.appendChild(addRow);
    div.appendChild(tlist);
    body.appendChild(div);
  });
}

  document.getElementById("tp-add-bucket").style.display="none";

  document.getElementById("tp-bucket-inp").style.display="none";

}

}

// Parse and execute TASK markers from Alfred response
function processTasks(text){
  var pattern = /\[TASK:({[^}]+})\]/g;
  var match; var ops=[];
  while((match=pattern.exec(text))!==null){
    try{ ops.push(JSON.parse(match[1])); }catch(e){}
  }
  ops.forEach(function(op){ taskOp(op); });
  return text.replace(/\[TASK:{[^}]+}\]/g,"").trim();
}

// ── Core state ──
function cleanForTTS(t){ return t.replace(/[*#`_~]/g,"").replace(/\s{3,}/g," ").trim(); }
function splitToSentences(text){
  var c=cleanForTTS(text), p=c.match(/[^.!?]+[.!?]+/g);
  if(!p||!p.length) return [c];
  return p.map(function(s){return s.trim();}).filter(function(s){return s.length>2;});
}

  S.ak=ak; S.ok=ok; S.ek=ek;
  LS.set("alf_ak",ak); if(ok) LS.set("alf_ok",ok); if(ek) LS.set("alf_ek",ek);
  document.getElementById("setup").style.display="none";
  initApp();
}
function initApp(){
  S.history=loadHistory();
  processAlfredImage(ALFRED_IMG,function(src){
    var av=document.getElementById("sb-avatar"); av.innerHTML="";
    var img=document.createElement("img"); img.src=src; img.alt="Alfred"; av.appendChild(img);
    document.getElementById("mini-photo").src=src;
  });
  if(IS_ELECTRON && window.alfredBridge && window.alfredBridge.onMiniChanged){
    window.alfredBridge.onMiniChanged(function(val){
      S.mini=val;
      document.getElementById("mini-overlay").className=val?"show":"";
      document.getElementById("app").style.display=val?"none":"block";
    });
  }
  var qa=document.getElementById("qa");
  QUICK_ACTIONS.forEach(function(q){
    var b=document.createElement("button"); b.className="qa-btn"; b.textContent=q.l;
    b.onclick=function(){unlockAudio();sendMessage(q.m);}; qa.appendChild(b);
  });
  document.getElementById("sp-ak").value=S.ak;
  document.getElementById("sp-ok").value=S.ok;
  document.getElementById("sp-ek").value=S.ek;
  renderTasks();
  if(S.history.length>0){
    S.history.forEach(function(m){
      if(m.role==="assistant"&&typeof m.content==="string") addMessage("alfred",m.content,null,false);
      else if(m.role==="user"&&typeof m.content==="string") addMessage("user",m.content,null,false);
    });
  } else {
    addMessage("alfred","Sistema activo, senor.\n\nEn que puedo servirle?",null,false);
  }
  updateMemBadge(); updateClock(); setInterval(updateClock,1000);
  document.getElementById("app").style.display="block";
  scrollToBottom();
}
function updateClock(){
  var now=new Date();
  var t=now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  var d=now.toLocaleDateString("es-ES",{day:"2-digit",month:"short"}).toUpperCase();
  document.getElementById("sb-clock").textContent=t+" - "+d;
  document.getElementById("mini-status").textContent=getStatusLabel()+" - "+t;
}
function getStatusLabel(){ return S.speaking?"SPEAKING":S.listening?"LISTENING":"ACTIVE"; }
function updateStatus(){
  document.getElementById("sb-status").textContent=getStatusLabel();
  var vb=document.getElementById("sb-voice");
  if(S.speaking){vb.classList.add("blink");}else{vb.classList.remove("blink");}
}
function updateMemBadge(){
  var n=Math.floor(S.history.length/2);
  document.getElementById("mem-badge").textContent=n>0?"Alfred recuerda "+n+" intercambio"+(n===1?"":"s")+" anteriores":"";
}
function addMessage(role,text,imageUrl,scroll){
  if(scroll===undefined) scroll=true;
  var msgs=document.getElementById("msgs");
  var typ=document.getElementById("typing-indicator"); if(typ) typ.remove();
  var row=document.createElement("div"); row.className="msg-row"+(role==="user"?" u":"");
  var av=document.createElement("div"); av.className="msg-av "+(role==="alfred"?"a":"u"); av.textContent=role==="alfred"?"A":"P";
  var body=document.createElement("div"); body.className="msg-body";
  if(imageUrl){var im=document.createElement("img");im.src=imageUrl;im.className="msg-img";im.alt="adjunto";body.appendChild(im);}
  if(text&&text!=="(imagen adjunta)"){var b=document.createElement("div");b.className="bbl "+(role==="alfred"?"a":"u");b.textContent=text;body.appendChild(b);}
  if(role==="alfred"){row.appendChild(av);row.appendChild(body);}else{row.appendChild(body);row.appendChild(av);}
  msgs.appendChild(row); if(scroll) scrollToBottom();
}
function showTyping(){
  var msgs=document.getElementById("msgs");
  var row=document.createElement("div"); row.id="typing-indicator"; row.className="msg-row";
  var av=document.createElement("div"); av.className="msg-av a"; av.textContent="A";
  var typ=document.createElement("div"); typ.className="typ";
  for(var i=0;i<3;i++){var d=document.createElement("div");d.className="td";typ.appendChild(d);}
  row.appendChild(av); row.appendChild(typ); msgs.appendChild(row); scrollToBottom();
}
function scrollToBottom(){ var m=document.getElementById("msgs"); m.scrollTop=m.scrollHeight; }
function showError(msg){ document.getElementById("err-txt").textContent=msg; document.getElementById("err-bar").classList.add("show"); }
function hideError(){ document.getElementById("err-bar").classList.remove("show"); }
function handleFile(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var b64=reader.result.split(",")[1]; var url=URL.createObjectURL(file);
    S.attachment={file:file,b64:b64,url:url,type:file.type||"image/jpeg"};
    document.getElementById("att-thumb").src=url; document.getElementById("att-name").textContent=file.name;
    document.getElementById("att-bar").classList.add("show");
  };
  reader.readAsDataURL(file); e.target.value="";
}
function clearAttachment(){
  if(S.attachment&&S.attachment.url) URL.revokeObjectURL(S.attachment.url);
  S.attachment=null; document.getElementById("att-bar").classList.remove("show");
}
function enqueueTTS(text,key){
  if(!S.voiceOut||!key) return;
  S.ttsCancelled=false;
  splitToSentences(text).forEach(function(s){S.ttsQueue.push(s);});
  if(!S.ttsPlaying) processNextTTS(key);
}
async function processNextTTS(key){
  if(S.ttsCancelled||!S.ttsQueue.length){S.ttsPlaying=false;S.speaking=false;updateStatus();return;}
  S.ttsPlaying=true; S.speaking=true; updateStatus();
  var sentence=S.ttsQueue.shift();
  try {
    var res=await fetch(ELEVEN_BASE,{method:"POST",headers:{"xi-api-key":key,"Content-Type":"application/json","Accept":"audio/mpeg"},
      body:JSON.stringify({text:sentence,model_id:"eleven_multilingual_v2",speed:1.2,voice_settings:{stability:0.5,similarity_boost:0.85,style:0.3,use_speaker_boost:true}})});
    if(!res.ok||S.ttsCancelled){S.ttsQueue=[];S.ttsPlaying=false;S.speaking=false;updateStatus();return;}
    var ab=await res.arrayBuffer();
    if(S.ttsCancelled){S.ttsPlaying=false;S.speaking=false;updateStatus();return;}
    if(!S.audioCtx) S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var ctx=S.audioCtx; if(ctx.state==="suspended") await ctx.resume();
    var buf=await ctx.decodeAudioData(ab);
    if(S.ttsCancelled){S.ttsPlaying=false;S.speaking=false;updateStatus();return;}
    var src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); S.currentSource=src;
    src.onended=function(){S.currentSource=null;processNextTTS(key);}; src.start(0);
  } catch(e){S.ttsQueue=[];S.ttsPlaying=false;S.speaking=false;updateStatus();}
}
function stopSpeaking(){
  S.ttsCancelled=true; S.ttsQueue=[]; S.ttsPlaying=false;
  if(S.currentSource){try{S.currentSource.stop()}catch(e){}S.currentSource=null;}
  S.speaking=false; updateStatus();
}
async function toggleMic(){
  if(S.listening){stopMic();return;}
  if(IS_ELECTRON){await startWhisperMic();}else{startNativeMic();}
}
function startNativeMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showError("SpeechRecognition no disponible.");return;}
  var rec=new SR(); rec.lang="es-ES"; rec.interimResults=false; rec.continuous=false;
  rec.onresult=function(ev){if(ev.results.length){var txt=ev.results[0][0].transcript;stopMic();sendMessage(txt);}};
  rec.onerror=function(ev){showError("Mic: "+ev.error);stopMic();};
  rec.onend=function(){S.listening=false;updateStatus();updateMicBtn();};
  S.recognition=rec;
  try{rec.start();S.listening=true;updateStatus();updateMicBtn();}catch(err){showError(err.message);}
}
async function startWhisperMic(){
  if(!S.ok){showError("Introduce tu OpenAI API key en ajustes.");return;}
  try {
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    S.audioChunks=[];
    var mimeType=MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4";
    S.mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType});
    S.mediaRecorder.ondataavailable=function(e){if(e.data.size>0)S.audioChunks.push(e.data);};
    S.mediaRecorder.onstop=async function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(S.audioChunks,{type:mimeType}); S.audioChunks=[];
      await transcribeWhisper(blob,mimeType);
    };
    S.mediaRecorder.start(); S.listening=true; updateStatus(); updateMicBtn();
  } catch(err){showError("Error de microfono: "+err.message);}
}
function stopMic(){
  if(S.recognition){try{S.recognition.stop()}catch(e){}S.recognition=null;}
  if(S.mediaRecorder&&S.mediaRecorder.state!=="inactive"){S.mediaRecorder.stop();}
  S.listening=false; updateStatus(); updateMicBtn();
}
async function transcribeWhisper(blob,mimeType){
  try {
    var ext=mimeType.includes("webm")?"webm":"mp4";
    var fd=new FormData();
    fd.append("file",blob,"audio."+ext); fd.append("model","whisper-1"); fd.append("language","es");
    var res=await fetch(WHISPER_URL,{method:"POST",headers:{"Authorization":"Bearer "+S.ok},body:fd});
    if(!res.ok){var e=await res.json().catch(function(){return{};});showError("Whisper: "+(e.error&&e.error.message?e.error.message:res.status));return;}
    var data=await res.json();
    if(data.text&&data.text.trim()) sendMessage(data.text.trim());
  } catch(e){showError("Error: "+e.message);}
}
function updateMicBtn(){
  var btn=document.getElementById("inp-mic");
  if(S.listening){btn.classList.add("on","blink");btn.innerHTML="&#9209;";}
  else{btn.classList.remove("on","blink");btn.innerHTML="&#127897;";}
}
async function sendMessage(text){
  unlockAudio();
  var ta=document.getElementById("inp-text");
  var msg=(text!==undefined?text:ta.value).trim();
  if((!msg&&!S.attachment)||S.loading) return;
  ta.value=""; autoResize(ta); hideError();
  var content;
  if(S.attachment){content=[{type:"image",source:{type:"base64",media_type:S.attachment.type,data:S.attachment.b64}},{type:"text",text:msg||"Que ves en esta imagen?"}];}
  else{content=msg;}
  var imgUrl=S.attachment?S.attachment.url:null;
  clearAttachment(); addMessage("user",msg||"(imagen adjunta)",imgUrl); showTyping();
  S.loading=true; stopSpeaking();
  S.history.push({role:"user",content:content});
  var ekSnap=S.ek; var voiceSnap=S.voiceOut;
  try {
    var res=await fetch(ANT_URL,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":S.ak,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1024,system:SYSTEM,messages:S.history})});
    var data=await res.json();
    if(!res.ok) throw new Error(data.error&&data.error.message?data.error.message:res.status);
    var raw=(data.content||[]).map(function(b){return b.text||"";}).join("")||"Error tecnico, senor.";
    var reply=processTasks(raw);
    S.history.push({role:"assistant",content:reply});
    saveHistory(); updateMemBadge(); addMessage("alfred",reply);
    if(voiceSnap&&ekSnap) enqueueTTS(reply,ekSnap);
  } catch(e){
    S.history.push({role:"assistant",content:"Problema de conexion, senor."});
    addMessage("alfred","Problema de conexion, senor."); showError(e.message);
  }
  S.loading=false;
}
function unlockAudio(){
  if(!S.audioCtx) S.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(S.audioCtx.state==="suspended") S.audioCtx.resume();
}
async function testVoice(){
  if(!S.ek){document.getElementById("sett-err").textContent="Introduce tu ElevenLabs API key primero.";document.getElementById("sett-err").style.display="block";return;}
  document.getElementById("sett-err").style.display="none";
  var btn=document.getElementById("sp-test"); btn.disabled=true; btn.textContent="Probando...";
  unlockAudio(); S.ttsQueue=[]; S.ttsPlaying=false; S.ttsCancelled=false;
  enqueueTTS("A su disposicion, senor.",S.ek);
  setTimeout(function(){btn.disabled=false;btn.textContent="Probar voz";},3000);
}
function toggleVoice(){
  unlockAudio(); S.voiceOut=!S.voiceOut; if(!S.voiceOut) stopSpeaking();
  var btn=document.getElementById("sb-voice");
  btn.innerHTML=S.voiceOut?"&#128266;":"&#128263;";
  btn.className="sb-btn"+(S.voiceOut?" on":"");
}
function toggleSettings(){
  S.showSettings=!S.showSettings;
  document.getElementById("sett-panel").style.display=S.showSettings?"block":"none";
  document.getElementById("sb-sett").className="sb-btn sm"+(S.showSettings?" on":"");
  if(S.showSettings){document.getElementById("sp-ak").value=S.ak;document.getElementById("sp-ok").value=S.ok;document.getElementById("sp-ek").value=S.ek;}
  else saveKeys();
}
function toggleMini(){
  unlockAudio();
  S.mini=!S.mini;
  document.getElementById("mini-overlay").className=S.mini?"show":"";
  document.getElementById("app").style.display=S.mini?"none":"block";
  if(IS_ELECTRON && window.alfredBridge) window.alfredBridge.setMini(S.mini);
}
function processAlfredImage(src,cb){
  var img=new Image();
  img.onload=function(){
    var c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
    var ctx=c.getContext("2d"); ctx.drawImage(img,0,0);
    var d=ctx.getImageData(0,0,c.width,c.height); var px=d.data;
    for(var i=0;i<px.length;i+=4){
      var r=px[i],g=px[i+1],b=px[i+2];
      if(r>220&&g>220&&b>220){var br=(r+g+b)/3;var alpha=Math.round((255-br)*3);px[i+3]=Math.min(Math.max(0,alpha),px[i+3]);}
    }
    ctx.putImageData(d,0,0); cb(c.toDataURL("image/png"));
  };
  img.src=src;
}
function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,80)+"px";}

document.addEventListener('paste', function(e) {
  if(S.mini || document.getElementById('app').style.display === 'none') return;
  var items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for(var i=0; i<items.length; i++) {
    if(items[i].type.indexOf('image') !== -1) {
      var file = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function() {
        var b64 = reader.result.split(',')[1];
        var url = URL.createObjectURL(file);
        S.attachment = {file:file, b64:b64, url:url, type:file.type||'image/png'};
        document.getElementById('att-thumb').src = url;
        document.getElementById('att-name').textContent = 'Imagen del portapapeles';
        document.getElementById('att-bar').classList.add('show');
      };
      reader.readAsDataURL(file);
      break;
    }
  }
});

(function(){
  var ak=LS.get("alf_ak"); var ok=LS.get("alf_ok")||""; var ek=LS.get("alf_ek")||"";
  if(ak){S.ak=ak;S.ok=ok;S.ek=ek;document.getElementById("setup").style.display="none";initApp();}
})();
</script>
